[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taperec"
version = "0.1.0"
description = "VCR for LLM agent traffic: record your agent's real API calls once (OpenAI, Anthropic, any httpx-based SDK), then replay them in CI — deterministic, offline, zero tokens, zero flake."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "osmanlam" }]
keywords = [
  "llm",
  "testing",
  "record replay",
  "cassette",
  "vcr",
  "agent testing",
  "mock llm",
  "deterministic tests",
  "ci",
  "openai",
  "anthropic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
taperec = "taperec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = []
